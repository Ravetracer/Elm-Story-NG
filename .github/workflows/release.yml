name: Release (Linux AppImage + Windows installer)

# Builds the desktop binaries and uploads them to a GitHub release.
#
#   - Linux:   AppImage
#   - Windows: NSIS installer (.exe)
#
# Trigger by pushing a tag that matches the package version, e.g.
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags
# or run it by hand from the Actions tab (workflow_dispatch), where the
# `platforms` input picks which binaries to build.
#
# Publishing is done with the `gh` CLI, NOT electron-builder's own publisher.
# electron-builder always manages a *draft* release; once a draft is published,
# a later run finds no draft, creates a fresh one, and the artifact lands in a
# phantom draft invisible on the public tag page. `gh release upload <tag>`
# instead targets the release that owns the tag — draft or published — so
# re-runs attach to the existing release. `--clobber` makes them idempotent.
#
# The release is created as a draft if it does not exist yet, so a tag push
# still produces a draft for you to review and Publish. Uploading into a release
# that already exists leaves its draft/published state alone, which is what lets
# a manual run add a binary to an already-published release without cutting a
# new one. See dev-doc/releasing.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which binaries to build'
        type: choice
        default: all
        options:
          - all
          - linux
          - windows

# The built-in GITHUB_TOKEN needs write access to create/update the release.
permissions:
  contents: write

jobs:
  appimage:
    # On a tag push, `github.event.inputs.platforms` is empty, so build. On a
    # manual run, only when linux was requested.
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","linux"]'), github.event.inputs.platforms) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Runs the app's postinstall (engine deps + the Electron binary fetch via
      # scripts/ensure-electron.mjs). legacy-peer-deps comes from .npmrc.
      - name: Install dependencies
        run: npm ci

      # `build` = engine:sync + typecheck + electron-vite build; then
      # electron-builder packs the AppImage into release/ without publishing.
      - name: Build AppImage
        run: npm run build && npx electron-builder --linux --publish never

      - name: Upload AppImage to the release
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "Elm-Story-NG $TAG" --notes "Desktop binaries for $TAG."
          gh release upload "$TAG" release/*.AppImage release/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    # Runs after appimage so the two jobs can never race to create two drafts
    # for one tag. `always()` keeps it running when appimage is skipped (a
    # windows-only manual run) or fails (the .exe is still worth shipping).
    needs: appimage
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","windows"]'), github.event.inputs.platforms)) }}
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The installer is unsigned: Windows SmartScreen shows a "protected your
      # PC" prompt the user clicks through. Code signing would go in the
      # electron-builder win config (certificateFile / signing env vars).
      - name: Build Windows installer
        run: npm run build && npx electron-builder --win --publish never

      - name: Upload installer to the release
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "Elm-Story-NG $TAG" --notes "Desktop binaries for $TAG."
          gh release upload "$TAG" release/*-Setup.exe release/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
