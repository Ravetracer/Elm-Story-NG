<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The Elm Story - NG mark in the title bar, which opens the info box.

  Derived from assets/es_logo_NG_favicon.svg and kept editable on purpose: this
  replaced an inline React component, so a design change no longer means a code
  change. It is imported as a URL and drawn by an <img>, which means CSS cannot
  reach the paths - the hover state in TitleBar/styles.module.less is a filter on
  the element, not a fill on the shapes.

  Two differences from the favicon it came from, both load-bearing:

  - The viewBox is cropped to the artwork instead of the favicon's 1024 square.
    An app icon wants its padding; a 22px title bar mark cannot afford it.
  - "NG" is outlined rather than set in Pengenalan. That font is installed on
    the author's machine and is not in the repository, so as text it would render
    in a fallback face for everyone else.

  Illegible below about 18px wide, which is the whole reason the title bar spells
  the name out beside it.
-->
