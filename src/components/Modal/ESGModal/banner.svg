<!--
  The "Elm Story - NG" wordmark shown at the top of the info box (ESGModal).

  Editable on purpose: this used to be an inline React component, which meant a
  design change was a code change. It is imported as a URL and rendered by an
  <img>, so nothing here is styleable from CSS - a colour change belongs in this
  file.

  Three groups, and they have different origins:

  - "Elm Story" is the original serif wordmark, kept glyph for glyph from the
    0.7.0 banner. There is no font for it anywhere in the repository, so these
    outlines are the only copy. Do not retype them as text.
  - The hyphen is drawn rather than set, for the same reason.
  - "NG" is Pengenalan, taken from assets/es_logo_NG_favicon.svg and converted
    to outlines. That font is not in the repository either, so it has to stay
    outlined or it renders in a fallback face on any machine but the author's.

  Baselines: the wordmark sits on y=97.34 and "NG" is scaled to a 36px cap
  height against the wordmark's 42px, which is what makes it read as a suffix.
-->
